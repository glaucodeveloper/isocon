name: Deploy ISOCON Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: isocon-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validar website
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório completo
        uses: actions/checkout@v6

      - name: Validar diretório publicado
        shell: bash
        run: |
          set -euo pipefail

          test -f website/index.html || {
            echo "::error file=website/index.html::website/index.html não foi encontrado."
            exit 1
          }

          test -d website/assets || {
            echo "::error file=website/assets::website/assets não foi encontrado."
            exit 1
          }

          if test -f website/data/catalog.json; then
            python3 -m json.tool website/data/catalog.json >/dev/null
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar somente ./website para o Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./website
          include-hidden-files: true

  deploy:
    name: Publicar ./website
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Fazer deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
